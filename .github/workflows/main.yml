name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app wsgi.py
      - run: flake8 app tests

  docker-build:
    name: Docker Image Assembly
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aceest-fitness-modular:${{ github.sha }} .

  container-tests:
    name: Automated Testing in Container
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aceest-fitness-modular:${{ github.sha }} .
      - run: docker run --rm aceest-fitness-modular:${{ github.sha }} pytest -v --cov=app
