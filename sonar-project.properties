# Unique name for this project inside SonarQube's dashboard
sonar.projectKey=aceest-fitness-modular

# Folder containing the actual application code to analyze
sonar.sources=app

# Folder containing the Pytest test files (kept separate so tests
# themselves aren't flagged for the same style rules as app code)
sonar.tests=tests

# Tells the scanner's Python analyzer which language version to assume
sonar.python.version=3.9
