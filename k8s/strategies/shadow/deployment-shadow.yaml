apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      containers:
        - name: aceest-fitness
          image: localhost:5050/aceest-fitness-modular:v1.2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
spec:
  selector:
    app: aceest-shadow
  ports:
    - port: 5000
      targetPort: 5000
