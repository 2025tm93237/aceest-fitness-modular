apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-a
  template:
    metadata:
      labels:
        app: aceest-a
    spec:
      containers:
        - name: aceest-fitness
          image: localhost:5050/aceest-fitness-modular:v1.1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a
spec:
  type: NodePort
  selector:
    app: aceest-a
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081
